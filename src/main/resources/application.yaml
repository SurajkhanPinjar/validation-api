server:
  port: 8081

security:
  api:
    keys:
      - ${SECURITY_API_KEYS:RAPID_API_INTERNAL_KEY_12345}

    rate-limit:
      per-second: 5
      per-minute: 100

spring:
  application:
    name: advanced-validation-api

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    com.validator.api: DEBUG

  # Optional: file logging
  file:
    name: logs/validator-api.log

  # Optional: rolling logs
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7